[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-workspace"
version = "0.5.0"
description = "Offline, evidence-linked investment workspace (Phases 1–4)"
requires-python = ">=3.12"
dependencies = ["openpyxl==3.1.5", "pydantic==2.13.4"]

[project.scripts]
investment-workspace = "investment_workspace.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investment_workspace = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

