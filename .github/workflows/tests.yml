name: Offline baseline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv pip check
      - run: uv build --out-dir /tmp/investment-dist
      - name: Verify installed version
        run: uv run --locked python -c "from importlib.metadata import version; from investment_workspace import __version__; assert version('investment-workspace') == __version__"
      - run: uv run --locked pytest
